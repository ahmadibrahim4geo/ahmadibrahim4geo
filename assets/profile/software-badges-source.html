<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CV software badges — source</title><style>
*{box-sizing:border-box}body{display:flex;flex-wrap:wrap;gap:12px;width:1000px;margin:0;padding:12px;background:transparent;font-family:"Segoe UI",Arial,sans-serif}.badge{display:flex;align-items:center;gap:9px;height:40px;border:1px solid #355166;border-radius:8px;background:#12283b;color:#f1f8fc;padding:5px 12px 5px 6px;white-space:nowrap}.mark{width:28px;height:28px;border-radius:5px;background:white;display:grid;place-items:center}.mark img{display:block;max-width:24px;max-height:24px;width:auto;height:auto}.badge strong{font-size:14px;font-weight:600}.signature{display:grid;place-items:center;background:#12283b;border-radius:8px;width:48px;height:48px}.signature img{max-width:32px;max-height:38px}
#global-mapper .mark{width:142px;background:transparent}#global-mapper .mark img{max-width:142px;max-height:28px}#global-mapper strong{display:none}#office .mark{width:160px}#office .mark img{max-width:154px;max-height:26px}#office strong{display:none}#infrawizard .mark{width:56px;background:transparent}#infrawizard .mark img{max-width:54px;max-height:28px}#stormcad .mark{width:42px}#stormcad .mark img{max-width:38px;max-height:24px}
</style></head><body><div class="badge" id="arcmap"><span class="mark"><img src="../brands/arcmap.ico" alt=""></span><strong>ArcMap / ArcGIS Desktop</strong></div>
